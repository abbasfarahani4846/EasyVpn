name: easyvpn
description: "Cross-platform high-performance universal VPN & proxy client with Go core and Flutter UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Native FFI & System Integration
  ffi: ^2.1.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # High-performance Persistence
  shared_preferences: ^2.2.3

  # UI & Networking
  http: ^1.2.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/rules/
