name: CI
on:
  push:
  pull_request:

env:
  TAGS: with_quic,with_wireguard,with_openvpn,with_clash_api,with_gvisor,with_utls

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - run: make -C core test
      - name: Cross-compile process cores
        run: make -C core linux-proc windows-proc darwin-proc

  flutter:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - name: Linux desktop deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev libsqlite3-dev
      - run: make -C core linux-proc lib-linux
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test          # includes integration tests against the built core
      - run: flutter build linux --release

  android:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.5' }
      - name: Build libeasycore.so (NDK)
        run: |
          NDK_BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          make -C core lib-android NDK_BIN=$NDK_BIN API=24
      - run: flutter pub get
      - run: flutter build apk --release

  windows:
    runs-on: windows-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.5' }
      - shell: bash
        run: |
          make -C core windows-proc
          bash scripts/fetch_wintun.sh
      - run: flutter pub get
      - run: flutter build windows --release

  macos:
    runs-on: macos-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.5' }
      - run: flutter pub get
      - run: bash scripts/package_macos.sh
