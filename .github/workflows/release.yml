name: Release

# Builds every platform and publishes a GitHub Release.
#   * push a tag   v1.2.3  -> stable release
#   * push to main         -> rolling "nightly" pre-release (replaced on each push)
#   * manual run           -> choose a version (or leave empty for a nightly-style build)
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version like 1.2.3 (empty = nightly build)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  FLUTTER_VERSION: '3.47.5'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      pubspec: ${{ steps.v.outputs.pubspec }}   # numeric x.y.z used by Flutter/Windows/Android
      label: ${{ steps.v.outputs.label }}       # used in file names
      tag: ${{ steps.v.outputs.tag }}
      nightly: ${{ steps.v.outputs.nightly }}
      code: ${{ steps.v.outputs.code }}         # numeric versionCode for Android
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          BASE_V=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/version: *([0-9]+\.[0-9]+).*/\1/')
          if [[ -z "$BASE_V" ]]; then BASE_V="1.0"; fi
          RUN_NUM="${GITHUB_RUN_NUMBER:-1}"
          V_CODE=$((1000 + RUN_NUM))

          IN="${{ github.event.inputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then IN="${GITHUB_REF#refs/tags/v}"; fi
          if [[ -n "$IN" ]]; then
            [[ "$IN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be x.y.z, got '$IN'"; exit 1; }
            echo "pubspec=$IN" >> "$GITHUB_OUTPUT"
            echo "label=$IN" >> "$GITHUB_OUTPUT"
            echo "tag=v$IN" >> "$GITHUB_OUTPUT"
            echo "code=$V_CODE" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
          else
            V_FULL="${BASE_V}.${RUN_NUM}"
            echo "pubspec=$V_FULL" >> "$GITHUB_OUTPUT"
            echo "label=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "code=$V_CODE" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- Linux
  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache-dependency-path: core/go.sum }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}' }
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev libsqlite3-dev
      - name: Stamp version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.version.outputs.pubspec }}+${{ needs.version.outputs.code }}/" pubspec.yaml
      - run: make -C core linux-proc
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=BUILD_LABEL=${{ needs.version.outputs.label }} --dart-define=BUILD_CHANNEL=${{ needs.version.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      - name: Package (tar.gz + deb)
        env:
          L: ${{ needs.version.outputs.label }}
          V: ${{ needs.version.outputs.pubspec }}
        run: |
          B=build/linux/x64/release/bundle
          mkdir -p dist
          tar -C "$B" -czf "dist/EasyVPN-$L-linux-x64.tar.gz" .
          echo "Portable mode: data is stored in the data folder next to this file." > "$B/portable"
          tar -C "$B" -czf "dist/EasyVPN-$L-linux-x64-portable.tar.gz" .
          rm "$B/portable"
          P=debroot
          mkdir -p $P/opt/easyvpn $P/usr/share/applications $P/DEBIAN $P/usr/bin
          cp -r "$B"/. $P/opt/easyvpn/
          ln -s /opt/easyvpn/easyvpn $P/usr/bin/easyvpn
          cat > $P/usr/share/applications/easyvpn.desktop <<D
          [Desktop Entry]
          Type=Application
          Name=EasyVPN
          Exec=/opt/easyvpn/easyvpn
          Categories=Network;
          D
          sed -i 's/^          //' $P/usr/share/applications/easyvpn.desktop
          cat > $P/DEBIAN/control <<D
          Package: easyvpn
          Version: $V
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libsecret-1-0, libayatana-appindicator3-1
          Maintainer: EasyVPN
          Description: Cross-platform proxy/VPN client (Flutter + sing-box)
          D
          sed -i 's/^          //' $P/DEBIAN/control
          printf '#!/bin/sh\nsetcap cap_net_admin,cap_net_bind_service+ep /opt/easyvpn/easycoreproc || true\n' > $P/DEBIAN/postinst
          chmod 755 $P/DEBIAN/postinst
          dpkg-deb --build $P "dist/EasyVPN-$L-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux, path: dist/*, if-no-files-found: error }

  # -------------------------------------------------------------- Windows
  windows:
    needs: version
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache-dependency-path: core/go.sum }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}' }
      - name: Stamp version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.version.outputs.pubspec }}+${{ needs.version.outputs.code }}/" pubspec.yaml
      - run: make -C core windows-proc
      - run: bash scripts/fetch_wintun.sh
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=BUILD_LABEL=${{ needs.version.outputs.label }} --dart-define=BUILD_CHANNEL=${{ needs.version.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      - name: Package
        env:
          L: ${{ needs.version.outputs.label }}
        run: |
          mkdir dist
          R=build/windows/x64/runner/Release
          # Installer-less zip and an explicit portable build (data stays beside the exe)
          powershell -NoProfile -Command "Compress-Archive -Path $R/* -DestinationPath dist/EasyVPN-${L}-windows-x64.zip"
          echo "Portable mode: settings and data are stored in the data folder next to easyvpn.exe." > $R/portable
          powershell -NoProfile -Command "Compress-Archive -Path $R/* -DestinationPath dist/EasyVPN-${L}-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with: { name: dist-windows, path: dist/*, if-no-files-found: error }

  # ---------------------------------------------------------------- macOS
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache-dependency-path: core/go.sum }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}' }
      - name: Stamp version
        run: |
          sed -i '' "s/^version:.*/version: ${{ needs.version.outputs.pubspec }}+${{ needs.version.outputs.code }}/" pubspec.yaml
      - run: flutter pub get
      - name: Import signing certificate (optional)
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Build and package
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          L: ${{ needs.version.outputs.label }}
          FLUTTER_BUILD_ARGS: --dart-define=BUILD_LABEL=${{ needs.version.outputs.label }} --dart-define=BUILD_CHANNEL=${{ needs.version.outputs.nightly == 'true' && 'nightly' || 'stable' }}
        run: |
          if [[ -n "$IDENTITY" ]]; then bash scripts/package_macos.sh --sign "$IDENTITY"; else bash scripts/package_macos.sh; fi
          mkdir dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/easyvpn.app "dist/EasyVPN-$L-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos, path: dist/*, if-no-files-found: error }

  # -------------------------------------------------------------- Android
  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache-dependency-path: core/go.sum }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}' }
      - name: Stamp version & clean gradle
        run: |
          sed -i "s/^version:.*/version: ${{ needs.version.outputs.pubspec }}+${{ needs.version.outputs.code }}/" pubspec.yaml
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true
      - name: Build libeasycore.so (arm64 + x86_64)
        run: make -C core lib-android NDK_BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin API=24
      - name: Release signing (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KS" ]]; then
            echo "$KS" | base64 --decode > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PW" "$KEY_ALIAS" "$KEY_PW" > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with the debug key (fine for testing, not for stores)."
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --dart-define=BUILD_LABEL=${{ needs.version.outputs.label }} --dart-define=BUILD_CHANNEL=${{ needs.version.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      - name: Package
        env:
          L: ${{ needs.version.outputs.label }}
        run: |
          mkdir dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/app-\(.*\)-release.apk/\1/')
            cp "$f" "dist/EasyVPN-$L-android-$abi.apk"
          done
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/EasyVPN-$L-android-universal.apk"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: dist-android, path: dist/*, if-no-files-found: error }

  # ------------------------------------------------------- raw Go cores
  cores:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache-dependency-path: core/go.sum }
      - name: Build
        env:
          L: ${{ needs.version.outputs.label }}
        run: |
          make -C core linux-proc windows-proc darwin-proc
          mkdir dist
          cp bin/easycoreproc-linux-amd64 "dist/easycoreproc-$L-linux-amd64"
          cp bin/easycoreproc-windows-amd64.exe "dist/easycoreproc-$L-windows-amd64.exe"
          cp bin/easycoreproc-darwin-arm64 "dist/easycoreproc-$L-darwin-arm64"
      - uses: actions/upload-artifact@v4
        with: { name: dist-cores, path: dist/*, if-no-files-found: error }

  # -------------------------------------------------------------- publish
  publish:
    needs: [version, linux, windows, macos, android, cores]
    # Publish whatever built successfully: one failing platform must not block the others.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      NIGHTLY: ${{ needs.version.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: dist-*, merge-multiple: true }
      - name: Fail if nothing was built
        run: test -n "$(ls -A dist 2>/dev/null)" || { echo 'no artifacts'; exit 1; }
      - name: Note failed platforms
        run: |
          {
            echo "Linux: ${{ needs.linux.result }}, Windows: ${{ needs.windows.result }}, macOS: ${{ needs.macos.result }}, Android: ${{ needs.android.result }}"
          } > platforms.txt
          cat platforms.txt
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        run: |
          if [[ "$NIGHTLY" == "true" ]]; then
            # rolling pre-release: drop the previous one (and its tag) so stale assets never accumulate
            gh release delete "$TAG" --cleanup-tag --yes || true
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Nightly ${GITHUB_SHA::7}" \
              --notes "Automated build of \`${GITHUB_SHA}\`. $(cat platforms.txt). Unsigned / debug-signed unless signing secrets are configured."
          else
            gh release delete "$TAG" --yes || true   # re-run of the same version replaces it
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "EasyVPN ${TAG}" --notes "$(cat platforms.txt)" --generate-notes
          fi
