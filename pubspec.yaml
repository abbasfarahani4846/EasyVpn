name: easyvpn
description: "Cross-platform high-performance universal VPN & proxy client with Go core and Flutter UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^3.0.3

  # Native core bridge
  ffi: ^2.1.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Storage
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0

  # UI / platform
  intl: any
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  file_picker: ^8.1.0
  mobile_scanner: ^6.0.0
  app_links: ^6.3.0
  dynamic_color: ^1.7.0
  window_manager: ^0.4.3
  tray_manager: ^0.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
